<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa · Entre Nós</title>
<meta name="description" content="Uma mesa do Entre Nós: tire uma carta na sua vez e responda no chat do grupo.">
<meta name="theme-color" content="#341d0c">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 28'%3E%3Crect width='20' height='28' fill='%23525e1b'/%3E%3Crect x='5' y='9' width='10' height='10' fill='%23efe7d2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<div class="pagina-mesa">
  <header class="barra">
    <a class="marca" href="./">Entre Nós</a>
    <span id="info-sala" class="codigo-sala" hidden></span>
    <div class="acoes" id="acoes-barra" hidden>
      <button class="btn btn-fantasma btn-peq" type="button" id="b-convidar">%%link%%<span>Convidar</span></button>
      <button class="btn btn-fantasma btn-peq" type="button" id="b-sair">%%sair%%<span>Sair da mesa</span></button>
    </div>
  </header>
  <div class="demo-aviso" id="demo-aviso" hidden>Modo demonstração: esta mesa existe só neste navegador. Abra outras abas com o link de convite para simular os amigos.</div>

  <main class="mesa" id="mesa">
    <section class="palco" id="palco" aria-live="polite">
      <p class="status">Abrindo a mesa...</p>
    </section>
    <aside class="chat" id="chat" aria-labelledby="t-chat" hidden>
      <div class="cab-chat"><span id="t-chat">Conversa da mesa</span><small id="chat-quem"></small></div>
      <div class="mensagens" id="mensagens" role="log" aria-live="polite" aria-label="Mensagens da mesa"></div>
      <form class="compor" id="compor">
        <label class="oculto" for="texto">Mensagem</label>
        <textarea id="texto" rows="1" maxlength="300" placeholder="Escreva para a mesa"></textarea>
        <button class="btn" type="submit" aria-label="Enviar mensagem">%%enviar%%</button>
      </form>
      <p class="contador" id="contador" aria-hidden="true"></p>
    </aside>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/cartas.js"></script>
<script src="js/logica.js"></script>
<script src="js/api.js"></script>
<script src="js/comum.js"></script>
<script src="js/jogo.js"></script>
</body>
</html>

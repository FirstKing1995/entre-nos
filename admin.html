<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organizador · Entre Nós</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#341d0c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 28'%3E%3Crect width='20' height='28' fill='%23525e1b'/%3E%3Crect x='5' y='9' width='10' height='10' fill='%23efe7d2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<header class="barra"><a class="marca" href="./">Entre Nós</a><span>Área do organizador</span></header>
<main class="admin">
  <form class="entrada" id="f-login" style="margin-top:48px">
    <h1>Área do organizador</h1>
    <p>Mesas abertas, cartas mais tiradas e o botão para encerrar uma mesa. A senha fica na aba Config da planilha.</p>
    <label class="campo"><span>Senha</span><input type="password" name="senha" autocomplete="current-password" required></label>
    <p class="aviso-erro" id="erro-login" role="alert"></p>
    <div><button class="btn" type="submit">Entrar</button></div>
  </form>

  <div id="painel" hidden>
    <div style="display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap">
      <h1>Painel das mesas</h1>
      <div style="display:flex;gap:8px"><button class="btn btn-fantasma btn-peq" type="button" id="b-atualizar">Atualizar</button><button class="btn btn-fantasma btn-peq" type="button" id="b-sair">Sair</button></div>
    </div>
    <div class="numeros" id="numeros"></div>
    <h2>Mesas</h2>
    <div class="tabela-wrap"><table>
      <thead><tr><th>Código</th><th>Situação</th><th>Lugares</th><th>Tom</th><th>Quem está</th><th>Cartas</th><th>Mensagens</th><th>Último movimento</th><th></th></tr></thead>
      <tbody id="salas"></tbody>
    </table></div>
    <h2>Cartas mais tiradas</h2>
    <ul class="ranking" id="ranking"></ul>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/cartas.js"></script>
<script src="js/logica.js"></script>
<script src="js/api.js"></script>
<script src="js/comum.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
